<button class="sidebar-open-btn">
    <style>
        @scope {
            :scope {
                position: absolute;
                top: 8px;
                left: 8px;
                transition: all .2s;
                border: 0;
                border-radius: 50%;
                background-color: rgb(0 0 0 / 60%);
                width: 48px;
                height: 48px;
                color: white;
                font-size: 32px;
            }

            :scope:hover {
                scale: 105%;
                z-index: 10;
                background-color: rgb(0 0 0 / 40%);
            }
        }
    </style>

    <i class="bi bi-three-dots-vertical"></i>
</button>

<aside class="sidebar" tabindex="-1">
    <style>
        @scope {
            & {
                --primary-color: darkslateblue;
                --secondary-color: slategray;

                display: none;
                position: fixed;
                flex-direction: column;
                transform: translate(-100%);
                z-index: 20;
                transition: all .2s, display .2s allow-discrete;
                inset: 0 auto 0 0;
                box-shadow: 0 2px 15px 0 rgb(0 0 0 / 10%);
                background-color: white;
                width: 100%;
                max-width: 264px;
                overflow: hidden auto;
                color: var(--primary-color);
                font-family: Arial, Helvetica, sans-serif;

                @starting-style {
                    translate: -100%;
                }
            }

            &.open {
                display: flex;
                transform: translate(0);
            }

            button {
                border: 0;
                background: none;
                padding: 0;
            }

            a {
                color: inherit;
                text-decoration: none;
            }
        }
    </style>

    <div>
        <style>
            @scope {
                & {
                    display: flex;
                    justify-content: end;
                }

                button {
                    transition: all .2s;
                    width: 48px;
                    height: 48px;
                    color: var(--primary-color);
                    font-size: 28px;
                }

                button:hover {
                    scale: 105%;
                    color: rgb(from var(--primary-color) r g b / 80%)
                }
            }
        </style>

        <button class="sidebar-close-btn">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <div>
        <style>
            @scope {
                ul {
                    margin: 0;
                    padding: 0;
                    font-size: 18px;
                }

                li a {
                    display: block;
                    transition: all .2s;
                    cursor: pointer;
                    border-bottom: 1px solid rgb(from var(--primary-color) r g b / 20%);
                    padding: 20px 16px;
                }

                li:last-of-type a {
                    border-bottom-color: transparent;
                }

                li a:is(.active, :hover, :focus) {
                    border-bottom-color: var(--primary-color);
                    background-color: var(--primary-color);
                    color: white;
                }

                li i {
                    margin-right: 8px;
                }
            }
        </style>

        <ul>
            {% for name, url, icon_class, active in links %}
            <li>
                <a href="{{ url }}" class="{% if active %}active{% endif %}">
                    <i class="bi {{ icon_class }}"></i> {{ name }}
                </a>
            </li>
            {% endfor %}
        </ul>
    </div>

    <div>
        <style>
            @scope {
                & {
                    margin: auto 16px 16px 16px;
                    font-size: 24px;
                }

                & > div {
                    display: flex;
                    flex-direction: column;
                    gap: 16px;

                    a, button {
                        display: block;
                        transition: all .2s;
                        cursor: pointer;
                        box-sizing: border-box;
                        border: 0;
                        border-radius: calc(infinity * 1px);
                        background-color: var(--secondary-color);
                        padding: 12px 8px;
                        width: 100%;
                        color: white;
                        font-size: 16px;
                        text-align: center;
                    }

                    :is(a, button):is(:focus, :hover) {
                        scale: 104%;
                        background-color: var(--primary-color);
                    }

                    :is(a, button).primary {
                        background-color: var(--primary-color);
                    }

                    i {
                        margin-right: 4px;
                    }
                }
            }
        </style>

        <div>
            <div>
                <a href="{{ url }}">
                    <i class="bi bi-person-circle mr-2"></i> My Account
                </a>
            </div>
            <div>
                <button class="primary">
                    <i class="bi bi-box-arrow-in-left"></i> Logout
                </button>
            </div>
        </div>
    </div>
</aside>

<script>
    const sidebar = document.querySelector('.sidebar')
    const sidebarOpenBtn = document.querySelector('.sidebar-open-btn')
    const sidebarCloseBtn = sidebar.querySelector('.sidebar-close-btn')

    const openSidebar = () => {
        sidebar.classList.add('open')
        sidebarCloseBtn.focus()
    }

    const closeSidebar = () => {
        sidebar.classList.remove('open')
    }

    const isSidebarOpen = () => sidebar.classList.contains('open')

    sidebarOpenBtn.addEventListener('click', openSidebar)
    sidebarCloseBtn.addEventListener('click', closeSidebar)

    sidebar.addEventListener('focusout', (e) => {
        if (!sidebar.contains(e.relatedTarget)) {
            closeSidebar()
        }
    })

    window.addEventListener('keyup', (e) => {
        if (e.key === 'Escape' && isSidebarOpen()) {
            closeSidebar()
        }
    })
</script>
